[tox]
envlist = py311, py312, lint
isolated_build = true

[testenv]
deps =
    pytest>=8
    pytest-cov
commands = pytest --cov=inventory {posargs}

[testenv:lint]
deps = ruff
commands = ruff check src tests

[pytest]
testpaths = tests
addopts = -ra -q

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build
