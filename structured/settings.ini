; settings.ini — sections, both separators, comments, typed values, a continuation, quotes
name = Inventory API
version = 1.4.0
debug
# a hash comment

[database]
host: db.internal
port = 5432
timeout_seconds = 30.5
ssl = On
dsn = "postgres://app@db/app;sslmode=require"
motd = first line of the message
    second line, indented, continues it

[features]
search = yes
export = no
max_upload_mb = 25

[remote "origin"]
url = git@github.com:sidewatch/inventory.git
fetch = +refs/heads/*:refs/remotes/origin/*
