# Gradle build settings for the inventory service
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Project
group=com.example
version=1.4.0
springBootVersion=3.3.4

# Feature flags
inventory.export.enabled=false
inventory.reorder.point=25

# Escaped characters and a continuation line
welcome.message=Welcome to the inventory service, \
    nothing here is billable\!
