# ──────────────────────────────────────────────────────────────────────
# Apache HTTP Server configuration for the warehouse stock portal.
# TODO: move the TLS block into its own included file.
# ──────────────────────────────────────────────────────────────────────

# ── Global directives ────────────────────────────────────────────────
ServerRoot "/usr/local/apache2"
ServerName stock.example.com:443
ServerAdmin ops@example.com
ServerTokens Prod
ServerSignature Off
Listen 80
Listen 443 https
Listen 192.0.2.10:8080
Listen [2001:db8::1]:8443
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
HostnameLookups Off
User daemon
Group daemon
PidFile "logs/httpd.pid"
Define WEB_ROOT /srv/stock
Define LOG_DIR "/var/log/apache2"
UseCanonicalName Off
TraceEnable Off

# ── Includes and environment ─────────────────────────────────────────
Include conf/extra/mime.conf
IncludeOptional conf/sites-enabled/*.conf
SetEnv APP_ENV production
PassEnv HOME PATH
UnsetEnv TEMP_SECRET

# ── Modules, conditional on availability ─────────────────────────────
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule expires_module modules/mod_expires.so
LoadModule authn_file_module modules/mod_authn_file.so

<IfModule mpm_event_module>
    StartServers 3
    MinSpareThreads 75
    MaxSpareThreads 250
    ThreadsPerChild 25
    MaxRequestWorkers 400
    MaxConnectionsPerChild 0
</IfModule>

<IfModule !mod_php.c>
    # no PHP handler loaded
</IfModule>

<IfDefine PRODUCTION>
    LogLevel warn
</IfDefine>
<IfDefine !PRODUCTION>
    LogLevel debug rewrite:trace3
</IfDefine>

# ── Logging with format strings ──────────────────────────────────────
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %O %D" proxy
CustomLog "${LOG_DIR}/access.log" combined
ErrorLog "${LOG_DIR}/error.log"
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P] %F: %E: [client %a] %M"

# ── Default deny, then open the document root ────────────────────────
<Directory />
    AllowOverride None
    Require all denied
    Options -Indexes -FollowSymLinks
</Directory>

<Directory "${WEB_ROOT}/public">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php
    <Limit GET POST>
        Require valid-user
    </Limit>
    <LimitExcept GET POST OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>

<DirectoryMatch "^/srv/stock/(private|internal)/">
    Require ip 192.0.2.0/24 2001:db8::/32
</DirectoryMatch>

<Files ".ht*">
    Require all denied
</Files>

<FilesMatch "\.(?i:gif|jpe?g|png|webp)$">
    Header set Cache-Control "public, max-age=604800, immutable"
    ExpiresActive On
    ExpiresDefault "access plus 1 week"
</FilesMatch>

<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

<LocationMatch "^/api/v[0-9]+/">
    ProxyPass "http://127.0.0.1:8080/"
    ProxyPassReverse "http://127.0.0.1:8080/"
</LocationMatch>

<Proxy "balancer://stock">
    BalancerMember "http://192.0.2.21:8080" loadfactor=3 route=a
    BalancerMember "http://192.0.2.22:8080" loadfactor=1 route=b
    ProxySet lbmethod=byrequests
</Proxy>

<If "%{HTTP_HOST} == 'old.example.com'">
    Redirect permanent / https://stock.example.com/
</If>
<ElseIf "%{REQUEST_URI} =~ m#^/legacy#">
    RedirectMatch 301 ^/legacy/(.*)$ /archive/$1
</ElseIf>
<Else>
    Header always set X-Frame-Options "SAMEORIGIN"
</Else>

# ── Virtual hosts ────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName stock.example.com
    ServerAlias www.stock.example.com
    RewriteEngine On
    RewriteCond %{HTTPS} !=on [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/ [NC,OR]
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L,QSA]
</VirtualHost>

<VirtualHost _default_:443>
    ServerName stock.example.com
    DocumentRoot "${WEB_ROOT}/public"
    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLCertificateFile "/etc/ssl/example/stock.crt"
    SSLCertificateKeyFile "/etc/ssl/example/stock.key"

    RewriteEngine On
    RewriteMap lowercase int:tolower
    RewriteRule ^/items/(.+)$ /item.php?sku=${lowercase:$1} [L,NE,QSA]
    RewriteRule ^/old-(.*)\.html$ /new-$1 [R=permanent,L]
    RewriteRule ^index\.html$ - [L]
    RewriteRule \.(?:jpg|png)$ - [E=IS_IMAGE:1]

    Header set X-Host %{HTTP_HOST}e
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header unset Server
    RequestHeader set X-Forwarded-Proto "https"

    ErrorDocument 404 /errors/404.html
    ErrorDocument 500 "Something went wrong"
    Alias /static "${WEB_ROOT}/static"
    ScriptAlias /cgi-bin/ "${WEB_ROOT}/cgi-bin/"
    AddType application/json .json
    AddHandler cgi-script .cgi
    AddOutputFilterByType DEFLATE text/html text/css application/javascript
    BrowserMatch "MSIE [2-6]" nokeepalive downgrade-1.0 force-response-1.0
    SetEnvIf Request_URI "\.(gif|png)$" dontlog
    Redirect 302 /home /

    <Directory "${WEB_ROOT}/public/admin">
        AuthType Basic
        AuthName "Warehouse admin"
        AuthUserFile "/etc/apache2/.htpasswd"
        Require valid-user
    </Directory>
</VirtualHost>

# ── Macros ───────────────────────────────────────────────────────────
<Macro Redirector $from $to>
    Redirect 301 $from $to
</Macro>
Use Redirector /old /new
UndefMacro Redirector

# ── Expression and require containers ────────────────────────────────
<RequireAny>
    Require ip 192.0.2.0/24
    Require expr "%{HTTP:X-Api-Key} == 'example-not-a-real-key'"
</RequireAny>

# ── Further directives and containers ────────────────────────────────
<IfVersion >= 2.4>
    Require all granted
</IfVersion>
<IfFile "/etc/apache2/extra.conf">
    Include "/etc/apache2/extra.conf"
</IfFile>
<IfSection MAIN>
    ServerLimit 16
</IfSection>
<MDomainSet stock.example.com>
    MDCertificateAgreement accepted
</MDomainSet>
<AuthnProviderAlias ldap ldap-alias>
    AuthLDAPURL "ldap://ldap.example.com/ou=people,dc=example,dc=com?uid?sub?(objectClass=*)"
</AuthnProviderAlias>
<Directory "${WEB_ROOT}/uploads">
    php_admin_flag engine off
    php_value upload_max_filesize 16M
    SetHandler None
    RemoveHandler .php .phtml
    Options -ExecCGI +SymLinksIfOwnerMatch
    AllowOverride AuthConfig FileInfo Indexes Limit Options=Indexes,MultiViews
    IndexOptions FancyIndexing HTMLTable NameWidth=* DescriptionWidth=40 VersionSort
    IndexOrderDefault Descending Date
    IndexIgnore .??* *~ *# HEADER* README* RCS CVS *,v *,t
    AddIcon /icons/image.png .gif .jpg .png
    AddDescription "Warehouse export" .csv
    ReadmeName README.html
    HeaderName HEADER.html
    AddLanguage en .en
    AddCharset UTF-8 .utf8
    AddEncoding x-gzip .gz
    DefaultType None
    ForceType text/plain
    FileETag MTime Size
    ContentDigest On
    EnableMMAP Off
    EnableSendfile On
    LimitRequestBody 10485760
    LimitXMLRequestBody 1048576
    Satisfy Any
    Order allow,deny
    Allow from 192.0.2.0/24
    Deny from all
</Directory>

# ── Rewrite, SetEnvIf, mod_security style variables ──────────────────
RewriteOptions Inherit
RewriteLogLevel 0
RewriteBase /
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d [OR]
RewriteCond %{QUERY_STRING} (^|&)debug=1(&|$) [NC]
RewriteCond %{TIME_HOUR}%{TIME_MIN} >0800 [NV]
RewriteCond ${lowercase:%{REQUEST_URI}} ^/x
RewriteRule ^(.*)$ index.php?path=$1 [L,QSA,B,C,CO=name:val:.example.com:3600,DPI,END,F,G,H=text/html,NC,NE,NS,P,PT,QSD,S=2,T=text/html,UnsafeAllow3F]
SetEnvIfNoCase User-Agent "^(bot|spider)" is_bot=1
SetEnvIfExpr "%{REQUEST_URI} =~ m#^/health#" no_log
BrowserMatchNoCase "curl" is_cli
CustomLog "|/usr/bin/rotatelogs -l ${LOG_DIR}/access.%Y%m%d.log 86400" common env=!no_log
CookieName stock_session
Session On
SessionCookieName session path=/;httponly;secure
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
AddDefaultCharset utf-8
AllowEncodedSlashes NoDecode
AcceptFilter https none
Mutex file:${APACHE_LOCK_DIR} default
