; ── Comments ──
; Application settings (INI). Semicolon comment.
# Hash comment is also accepted by many parsers.
  ; Indented comment.

; ── Global keys before any section ──
global_key = value before sections
name: colon separator

[general]
name = Inventory API
version = 1.4.0
debug = false
verbose = yes
quiet = no
enabled = on
disabled = off
active = true
empty =
no_equals_flag

[database]
host = db.internal
port = 5432
user = inventory
; the password lives in the environment, not here
password = ${DB_PASSWORD}
timeout_seconds = 30
url = postgres://inventory@db.internal:5432/stock?sslmode=require

; ── Value types ──
[types]
integer = 42
negative = -17
float = 3.14159
exponent = 6.02e23
hex = 0xFF
octal = 0755
boolean_true = TRUE
boolean_false = FALSE
null_like = null
version_string = 1.2.3-rc.1
size = 512M
duration = 30s
percent = 85%
date = 2026-09-24
time = 10:30:00
timestamp = 2026-09-24T10:30:00+01:00
ip = 192.0.2.10
ipv6 = 2001:db8::1
mac = 00:11:22:33:44:55
email = ops@example.com
glob = *.log
regex = ^[A-Z]{3}-\d{4}$

; ── Strings and quoting ──
[strings]
unquoted = plain text with spaces
double = "double quoted value"
single = 'single quoted value'
with_quotes = "she said \"hi\""
escapes = "tab\there, newline\nthere, backslash \\ unicode \u00e9 \x41"
equals_in_value = a=b=c
colon_in_value = host:port
semicolon_in_value = a ; b
inline_comment = value ; trailing comment
hash_value = color #ff8800
leading_space =   trimmed
quoted_space = "  preserved  "
path_windows = C:\warehouse\bin
unicode = café 日本語 ☕

; ── Multi-line and continuation ──
[multiline]
backslash = first line \
  second line \
  third line
indented_continuation = line one
  line two continues here
  line three
list =
  alpha
  beta
  gamma
heredoc = """
Triple quoted
multi-line value
"""

; ── Keys: spacing, case, symbols, duplicates, arrays ──
[keys]
key = 1
Key = 2
KEY_WITH_UNDERSCORE = 3
key-with-dash = 4
key.with.dots = 5
key with spaces = 6
key/with/slash = 7
"quoted key" = 8
key[] = first
key[] = second
array[0] = a
array[1] = b
duplicate = one
duplicate = two
tab	separated = value
colon: separated
spaced   =   widely

; ── Sections: nesting, dotted, quoted, special names ──
[server]
bind = 0.0.0.0
port = 8080

[server.tls]
cert = /etc/ssl/cert.pem
key = /etc/ssl/key.pem

[server "tls-alt"]
cert = /etc/ssl/alt.pem

[ spaced section ]
inner = value

[section/with/slashes]
a = 1

[section:with:colons]
b = 2

[section.with.dots.and-dashes_and_underscores]
c = 3

[Unicode Section café]
d = 4

[features]
search = on
export = off
max_upload_mb = 25

; ── Variables and substitution ──
[paths]
data = /var/lib/inventory
logs = ${data}/logs
backup = %(data)s/backup
home = $HOME/inventory
env = ${env:HOME}/inventory
other = ${general:name}
tilde = ~/inventory
relative = ./relative/path
include = conf.d/*.ini
reference = @{database:host}
interpolated = %(logs)s/%(name)s.log

; ── Include directives (parser specific) ──
[include]
files = base.ini, local.ini
@include = extra.ini
!include_dir /etc/inventory.d

[DEFAULT]
default_timeout = 30
default_retries = 3

[profile:production]
inherits = DEFAULT
retries = 5

[end]
last = value

; ── PHP-style values: constants, bit expressions, On/Off/None ──
[PHP]
engine = On
short_open_tag = Off
precision = 14
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
memory_limit = 128M
include_path = ".:/usr/share/php"
extension=pdo_pgsql
zend_extension=opcache
date.timezone = "Europe/London"
session.save_path = "/tmp"
disable_functions =
upload_max_filesize = 2M
log_errors = 1
error_log = syslog
auto_prepend_file = None
variables_order = "GPCS"
sendmail_path = /usr/sbin/sendmail -t -i

; ── systemd / desktop-entry style ──
[Unit]
Description=Inventory API service
After=network.target postgresql.service
Wants=postgresql.service
ConditionPathExists=/etc/inventory/config.ini

[Service]
Type=notify
ExecStart=/usr/bin/inventory --config /etc/inventory/config.ini
ExecReload=/bin/kill -HUP $MAINPID
Environment="LOG_LEVEL=info" "MODE=prod"
EnvironmentFile=-/etc/default/inventory
Restart=on-failure
RestartSec=5s
LimitNOFILE=65536
ExecStartPre=-/bin/mkdir -p /run/inventory
ExecStartPre=+/bin/true

[Desktop Entry]
Version=1.0
Type=Application
Name=Inventory
Name[de]=Lager
Name[fr]=Inventaire
Comment=Manage stock
Exec=inventory %U
Icon=inventory
Terminal=false
Categories=Office;Utility;
MimeType=text/csv;application/json;
Keywords=stock;warehouse;

; ── Samba / Windows style ──
[global]
   workgroup = WORKGROUP
   server string = %h server (Samba, Ubuntu)
   log file = /var/log/samba/log.%m
   max log size = 1000
   security = user
   map to guest = bad user
   hosts allow = 192.0.2. 127.
   invalid users = root

[share]
   path = /srv/share
   read only = no
   valid users = @staff, jane
   create mask = 0660

; ── Operators and unusual separators ──
[operators]
plain = value
colon: value
append += more
remove -= less
assign := computed
bang! = value
at@sign = value
dollar$key = $value
percent%key = 100%
equals-in-key\=escaped = value
colon-in-key\:escaped = value
spaces\ in\ key = value
; Section header with trailing comment
[after-comment] ; comment after header
x = 1
[tight]y=2
[ lead and trail ]  
z = 3

; ── Edge cases ──
[edge]
=value with empty key
key =
key2 = ""
key3 = ''
key4 = \
key5 = tab	inside
key6 = trailing backslash \\
key7 = "unterminated quote
key8 = ;not a value, a comment-looking value
key9 = #also not a comment
CamelCase = MixedCase
UPPER = CASE
lower = case
1numeric = start with digit
_underscore = start
-dash = start
.dot = start
very_long_key_name_that_goes_on_and_on_and_on_and_on_and_on_and_on_and_on = very long value that also goes on and on and on and on and on and on and on and on and on and on
; Non-ASCII: café 日本語 ☕

