# nginx 1.29 — syntax showcase: TLS front door, upstreams, caching, maps, streams and mail.
# Top-level blocks (http, stream, mail, events) repeat below so every directive family appears; a real config has one of each.
# TODO: move the certificate paths into an included file
user nginx nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;
load_module modules/ngx_http_geoip_module.so;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65s;
    client_max_body_size 16m;
    server_tokens off;
    charset utf-8;

    # ── Logging ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time"';
    log_format json escape=json '{"ip":"$remote_addr","status":$status,"uri":"$uri"}';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Variables, maps, geo ──
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    map $request_uri $is_static {
        ~*\.(css|js|png|woff2)$ 1;
        default                 0;
    }
    geo $office {
        default        0;
        192.0.2.0/24   1;
        2001:db8::/32  1;
    }
    split_clients "${remote_addr}AAA" $variant {
        10%   "a";
        *     "b";
    }
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache:10m max_size=1g inactive=60m use_temp_path=off;

    # ── Compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ── Upstreams ──
    upstream api {
        least_conn;
        server 10.0.0.11:8080 weight=2 max_fails=3 fail_timeout=30s;
        server 10.0.0.12:8080;
        server [2001:db8::1]:8080 backup;
        server unix:/run/api.sock down;
        keepalive 32;
    }

    upstream sticky {
        ip_hash;
        server api1.example.com:9000;
        server api2.example.com:9000;
    }

    # ── Plain HTTP redirect ──
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main site ──
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name example.com www.example.com *.example.org ~^(?<sub>.+)\.example\.net$;
        root /srv/site;
        index index.html index.htm;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Variant $variant;

        error_page 404 /404.html;
        error_page 500 502 503 504 =200 /50x.html;

        if ($http_user_agent ~* "(bot|crawler)") {
            set $limited 1;
        }
        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn perip 10;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 30s;
            proxy_cache cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_use_stale error timeout updating;
        }

        location ~* \.(css|js|png|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ^~ /static/ {
            alias /srv/static/;
        }

        location = /healthz { return 200 "ok\n"; }

        location @fallback {
            rewrite ^/old/(.*)$ /new/$1 permanent;
            rewrite ^/legacy /modern last;
        }

        location /internal/ {
            internal;
            allow 192.0.2.0/24;
            allow 2001:db8::/32;
            deny all;
            auth_basic "Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        location /ws/ {
            proxy_pass http://sticky;
            proxy_set_header Upgrade $http_upgrade;
        }

        location /status {
            stub_status;
        }

        location /lua {
            content_by_lua_block {
                ngx.say("hello from lua")
            }
        }
    }
}

# ── TCP/UDP proxying ──
stream {
    upstream db {
        server 10.0.0.21:5432;
    }
    server {
        listen 5432;
        proxy_pass db;
        proxy_connect_timeout 5s;
    }
    server {
        listen 5353 udp reuseport;
        proxy_pass 192.0.2.53:53;
    }
}

# ── Mail proxying ──
mail {
    server_name mail.example.com;
    auth_http 127.0.0.1:9000/auth;
    server {
        listen 143;
        protocol imap;
    }
}

# ── More contexts and directives ──
env TZ;
env INVENTORY_HOME=/opt/inventory;
daemon off;
master_process on;
thread_pool default threads=32 max_queue=65536;
timer_resolution 100ms;
pcre_jit on;
ssl_engine pkcs11;

http {
    types {
        text/html  html htm;
        image/svg+xml svg svgz;
    }
    resolver 192.0.2.53 [2001:db8::53] valid=30s ipv6=off;
    resolver_timeout 5s;
    map_hash_bucket_size 128;
    variables_hash_max_size 2048;
    server_names_hash_bucket_size 64;
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    aio threads;
    directio 4m;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/chain.pem;
    ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_prefer_server_ciphers on;
    ssl_early_data on;
    ssl_session_tickets off;
    ssl_verify_client optional;
    ssl_client_certificate /etc/ssl/ca.pem;
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 8k;
    proxy_redirect off;
    proxy_ssl_server_name on;
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    real_ip_header X-Forwarded-For;
    set_real_ip_from 192.0.2.0/24;
    set_real_ip_from 2001:db8::/32;
    real_ip_recursive on;
    log_not_found off;
    underscores_in_headers on;
    ignore_invalid_headers off;
    lingering_close on;
    reset_timedout_connection on;
    send_timeout 10s;
    large_client_header_buffers 4 16k;
    etag off;
    absolute_redirect off;
    port_in_redirect off;
    msie_padding off;

    upstream backend {
        zone backend 64k;
        hash $request_uri consistent;
        random two least_time=header;
        server backend1.example.com:80 slow_start=30s;
        server backend2.example.com:80 resolve;
        queue 100 timeout=70;
        sticky cookie srv_id expires=1h domain=.example.com path=/;
        keepalive_requests 1000;
        keepalive_time 1h;
        keepalive_timeout 60s;
        ntlm;
    }

    server {
        listen 8443 ssl;
        listen unix:/run/nginx.sock;
        listen 127.0.0.1:8080 default_server backlog=511 reuseport so_keepalive=on;
        server_name ~^www\d+\.example\.com$ .example.net "";
        server_name_in_redirect off;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_read_timeout 300;
        }

        location /uwsgi/ { uwsgi_pass 127.0.0.1:3031; include uwsgi_params; }
        location /scgi/ { scgi_pass 127.0.0.1:4000; }
        location /grpc/ { grpc_pass grpc://backend; grpc_set_header X-Real-IP $remote_addr; }
        location /memc/ { set $memcached_key $uri; memcached_pass 127.0.0.1:11211; }

        location /auth {
            auth_request /auth/check;
            auth_request_set $user $upstream_http_x_user;
            satisfy any;
            allow 192.0.2.1;
            deny all;
        }
        location = /auth/check { internal; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_pass http://127.0.0.1:9001; }

        location /files/ {
            limit_except GET HEAD { deny all; }
            autoindex on;
            autoindex_exact_size off;
            autoindex_format json;
            sendfile_max_chunk 512k;
            add_trailer X-Trailer "done";
            sub_filter 'http://old.example.com' 'https://example.com';
            sub_filter_once off;
            sub_filter_types text/html text/css;
            mirror /mirror;
            mirror_request_body on;
        }
        location = /mirror { internal; proxy_pass http://backend$request_uri; }

        location /redirect {
            if ($arg_id ~ "^\d+$") { rewrite ^ /item/$arg_id? permanent; }
            if ($request_filename ~* \.(jpg|png)$) { break; }
            if (-f $request_filename) { break; }
            if (!-d $request_filename) { return 404; }
            if ($http_cookie ~* "session=([^;]+)(;|$)") { set $session $1; }
            if ($host = 'example.org') { return 301 https://example.com$request_uri; }
            if ($slow) { limit_rate 10k; limit_rate_after 500k; }
            return 302 /new;
        }

        location ~* ^/(?<lang>en|fr)/(?<page>.+)$ { try_files /$lang/$page.html =404; }
        location ~ "^/\d{4}/\d{2}/(.*)$" { return 200 "captured $1\n"; }

        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
        }

        location /perl { perl handler; }
        location /njs { js_content main.handler; }
        location /geo { add_header X-Country $geoip_country_code; }
        location /echo { echo "hello"; }
        location /secure { secure_link $arg_md5,$arg_expires; secure_link_md5 "$secure_link_expires$uri secret"; }
        location /video { mp4; mp4_buffer_size 1m; flv; }
        location /img { image_filter resize 150 100; }
        location /dav { dav_methods PUT DELETE MKCOL COPY MOVE; create_full_put_path on; }
        location /xslt { xslt_stylesheet /etc/nginx/style.xsl; }
        location /zip { zip; }
        location /hls { hls; hls_fragment 5s; }
        location /ssi { ssi on; ssi_types text/shtml; }
        location /rewrite_log { rewrite_log on; error_log /var/log/nginx/rewrite.log notice; }
        location /ranges { max_ranges 0; slice 1m; proxy_set_header Range $slice_range; }
        location /status_api { api write=on; allow 127.0.0.1; deny all; }
    }
}

include /etc/nginx/conf.d/*.conf;
include sites-enabled/*;

# ── HTTP/2, HTTP/3 (QUIC), TLS and modern directives ──
http {
    map $host $backend_name {
        hostnames;
        volatile;
        default        backend;
        example.com    primary;
        *.example.org  secondary;
        include        /etc/nginx/extra-hosts.map;
    }
    geo $remote_addr $trusted {
        ranges;
        proxy 192.0.2.254;
        proxy_recursive;
        delete 192.0.2.0/25;
        default 0;
        192.0.2.1-192.0.2.9 1;
        include /etc/nginx/trusted.geo;
    }
    keyval_zone zone=bans:1m state=/var/lib/nginx/bans.keyval timeout=1h;
    keyval $remote_addr $banned zone=bans;
    charset_map koi8-r utf-8 {
        C0 D18E;
        C1 D0B0;
    }
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_dry_run on;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    server {
        listen 443 quic reuseport;
        listen 443 ssl;
        listen [::]:443 quic reuseport;
        listen [::]:443 ssl;
        http2 on;
        http3 on;
        http3_hq off;
        quic_retry on;
        quic_gso on;
        quic_bpf on;
        quic_active_connection_id_limit 4;
        http3_max_concurrent_streams 128;
        http3_stream_buffer_size 64k;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header QUIC-Status $http3 always;
        server_name example.com;
        ssl_certificate     /etc/nginx/ecdsa.pem;
        ssl_certificate_key /etc/nginx/ecdsa.key;
        ssl_certificate     /etc/nginx/rsa.pem;
        ssl_certificate_key /etc/nginx/rsa.key;
        ssl_certificate_cache max=1000 inactive=20s valid=1m;
        ssl_conf_command Options PrioritizeChaCha;
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        ssl_password_file /etc/nginx/ssl.pass;
        ssl_ocsp on;
        ssl_ocsp_responder http://ocsp.example.com;
        ssl_crl /etc/ssl/crl.pem;
        ssl_verify_depth 2;
        ssl_buffer_size 4k;
        ssl_alpn h2 http/1.1;
        ssl_session_ticket_key /etc/nginx/ticket.key;
        ssl_reject_handshake off;
        ssl_early_data on;
        proxy_set_header Early-Data $ssl_early_data;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_cookie_domain localhost example.com;
        proxy_cookie_path /one/ /two/;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 3;
        proxy_cache_methods GET HEAD POST;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_bypass $http_pragma $http_authorization;
        proxy_no_cache $cookie_session $arg_nocache;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header X-Powered-By;
        proxy_pass_header Server;
        proxy_intercept_errors on;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_socket_keepalive on;
        proxy_bind $server_addr transparent;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/ca.pem;
        proxy_ssl_name backend.example.com;
        proxy_ssl_session_reuse on;
        proxy_ssl_certificate /etc/nginx/client.pem;
        proxy_ssl_certificate_key /etc/nginx/client.key;

        location / {
            if ($banned) { return 403; }
            set $upstream "http://$backend_name";
            proxy_pass $upstream;
            set $combined "${scheme}://${host}${request_uri}";
            set $quoted 'single \'quoted\' value';
            set $dq "double \"quoted\" value with $variable and ${braced}";
            return 200 "escaped \\ backslash \$ dollar\n";
        }
        location ~* \.(?<ext>jpe?g|png|gif)$ {
            add_header X-Ext $ext;
            try_files $uri @named =404;
        }
        location @named { return 404; }
        location /ranged {
            max_ranges 10;
            slice 1m;
            if_modified_since before;
            expires modified +24h;
            expires @15h30m;
            expires epoch;
            expires -1;
            expires max;
            add_before_body /header.html;
            add_after_body /footer.html;
            addition_types text/html;
            gunzip on;
            gzip_static on;
            gzip_vary on;
            gzip_proxied any;
            gzip_min_length 256;
            brotli on;
            brotli_comp_level 6;
        }
        location /upstream-with-vars {
            resolver 192.0.2.53 valid=10s;
            proxy_pass http://$host:8080$request_uri;
            proxy_pass http://unix:/run/api.sock:/path;
            proxy_pass https://api.example.com/v2/;
        }
        location /njs {
            js_import main from /etc/nginx/main.js;
            js_set $summary main.summary;
            js_var $token;
            js_content main.handler;
            js_header_filter main.filter;
            js_body_filter main.body;
            js_fetch_trusted_certificate /etc/ssl/ca.pem;
        }
    }

    upstream svc {
        zone svc 128k;
        least_time header inflight;
        server svc.example.com service=http resolve;
        server 192.0.2.10:80 weight=5 max_conns=100;
        server 192.0.2.11:80 drain;
        state /var/lib/nginx/svc.state;
        resolver 192.0.2.53;
        resolver_timeout 3s;
        hash "$remote_addr$uri" consistent;
        ip_hash;
        random;
        least_conn;
        keepalive 16;
    }
}

# ── stream with SNI routing and PROXY protocol ──
stream {
    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/stream.log basic buffer=16k;
    map $ssl_preread_server_name $stream_backend {
        default           default_tls;
        a.example.com     tls_a;
        ~^b\d\.example\.com$ tls_b;
    }
    upstream default_tls { server 192.0.2.30:443; }
    upstream tls_a { server 192.0.2.31:443; }
    upstream tls_b { server 192.0.2.32:443; }
    server {
        listen 443;
        listen [::]:443;
        listen 8443 ssl proxy_protocol;
        ssl_preread on;
        preread_buffer_size 16k;
        preread_timeout 5s;
        proxy_pass $stream_backend;
        proxy_protocol on;
        proxy_timeout 10m;
        proxy_responses 1;
        proxy_next_upstream_tries 3;
        proxy_download_rate 1m;
        proxy_upload_rate 1m;
        set_real_ip_from 192.0.2.0/24;
        allow 192.0.2.0/24;
        deny all;
        limit_conn perip 4;
        ssl_certificate /etc/nginx/stream.pem;
        ssl_certificate_key /etc/nginx/stream.key;
        return "stream reply";
    }
    server {
        listen 5300 udp;
        proxy_pass dns_upstream;
        proxy_requests 1;
    }
    upstream dns_upstream { server 192.0.2.53:53; server [2001:db8::53]:53; }
    js_import stream_main from /etc/nginx/stream.js;
    js_preread stream_main.preread;
    js_filter stream_main.filter;
}

# ── mail with STARTTLS and SMTP auth ──
mail {
    server_name mail.example.com;
    auth_http 127.0.0.1:9000/auth;
    auth_http_timeout 5s;
    auth_http_header X-Auth-Key "example-not-a-real-key";
    proxy_pass_error_message on;
    proxy_timeout 1m;
    proxy_smtp_auth on;
    xclient on;
    imap_capabilities "IMAP4rev1" "UIDPLUS";
    pop3_capabilities "TOP" "USER";
    smtp_capabilities "SIZE 10485760" "8BITMIME";
    imap_auth plain login cram-md5;
    pop3_auth plain apop;
    smtp_auth login plain none;
    starttls on;
    ssl_certificate /etc/nginx/mail.pem;
    ssl_certificate_key /etc/nginx/mail.key;
    server {
        listen 25;
        listen 465 ssl;
        listen 587;
        protocol smtp;
        smtp_greeting_delay 1s;
    }
    server { listen 993 ssl; protocol imap; }
    server { listen 995 ssl; protocol pop3; }
}
