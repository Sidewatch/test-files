# ── Comments ──
# Gradle and Java properties showcase for the inventory service.
! An exclamation mark also starts a comment line.
   # Comments may be indented. TODO: move secrets to the keychain
   ! FIXME: duplicate keys are last-one-wins

# ── Separators: =, :, and whitespace ──
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching: true
org.gradle.configuration-cache   true
org.gradle.daemon=false

# ── Project coordinates ──
group=com.example
version=1.4.0-SNAPSHOT
springBootVersion=3.3.4
kotlin.code.style=official
android.useAndroidX=true

# ── Typed-looking values ──
inventory.reorder.point=25
inventory.tax.rate=0.075
inventory.export.enabled=false
inventory.retry.max=0x1F
inventory.window.ms=1_000
inventory.empty=
inventory.nothing
inventory.url=https://api.example.com/v1/items?limit=50&sort=name

# ── Variable substitution and system properties ──
systemProp.http.proxyHost=proxy.example.com
systemProp.http.proxyPort=8080
systemProp.https.nonProxyHosts=*.example.com|localhost
artifact.name=inventory-${version}
log.dir=${user.home}/logs/${group}
home=$HOME
build.output=${project.buildDir}/libs

# ── Escapes ──
welcome.message=Welcome to the inventory service, \
    nothing here is billable\!
windows.path=C:\\Program Files\\Inventory\\bin
tab.separated=one\ttwo\tthree
newline.value=line one\nline two
unicode.value=caf\u00e9 \u2603 \u00FF
escaped\ key\ with\ spaces=value with spaces
escaped\:colon\=equals=both are literal in the key
leading.space=\   preserved leading spaces
quote.value="quotes are not special" and 'neither are these'

# ── Continuation lines ──
long.list=alpha,\
          beta,\
          gamma,\
          delta
multi.line.jvm=-Xms512m \
  -Xmx2g \
  -XX:MaxMetaspaceSize=256m

# ── Keys with various shapes ──
a=1
a.b=2
a.b.c=3
UPPER_SNAKE_CASE=4
camelCaseKey=5
dash-separated-key=6
under_score_key=7
key.with.numbers.123=8
[bracketed]=9
list[0]=first
list[1]=second
map.key[name]=value
@scope/package=1.2.3
