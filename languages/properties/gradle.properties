# Java Properties (java.util.Properties, Java 25) with Gradle 9 gradle.properties keys — syntax showcase
# ── Comments ──
# Gradle and Java properties showcase for the inventory service.
! An exclamation mark also starts a comment line.
   # Comments may be indented. TODO: move secrets to the keychain
   ! FIXME: duplicate keys are last-one-wins

# ── Separators: =, :, and whitespace ──
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching: true
org.gradle.configuration-cache   true
org.gradle.daemon=false

# ── Project coordinates ──
group=com.example
version=1.4.0-SNAPSHOT
springBootVersion=3.3.4
kotlin.code.style=official
android.useAndroidX=true

# ── Typed-looking values ──
inventory.reorder.point=25
inventory.tax.rate=0.075
inventory.export.enabled=false
inventory.retry.max=0x1F
inventory.window.ms=1_000
inventory.empty=
inventory.nothing
inventory.url=https://api.example.com/v1/items?limit=50&sort=name

# ── Variable substitution and system properties ──
systemProp.http.proxyHost=proxy.example.com
systemProp.http.proxyPort=8080
systemProp.https.nonProxyHosts=*.example.com|localhost
artifact.name=inventory-${version}
log.dir=${user.home}/logs/${group}
home=$HOME
build.output=${project.buildDir}/libs

# ── Escapes ──
welcome.message=Welcome to the inventory service, \
    nothing here is billable\!
windows.path=C:\\Program Files\\Inventory\\bin
tab.separated=one\ttwo\tthree
newline.value=line one\nline two
unicode.value=caf\u00e9 \u2603 \u00FF
escaped\ key\ with\ spaces=value with spaces
escaped\:colon\=equals=both are literal in the key
leading.space=\   preserved leading spaces
quote.value="quotes are not special" and 'neither are these'

# ── Continuation lines ──
long.list=alpha,\
          beta,\
          gamma,\
          delta
multi.line.jvm=-Xms512m \
  -Xmx2g \
  -XX:MaxMetaspaceSize=256m

# ── Keys with various shapes ──
a=1
a.b=2
a.b.c=3
UPPER_SNAKE_CASE=4
camelCaseKey=5
dash-separated-key=6
under_score_key=7
key.with.numbers.123=8
[bracketed]=9
list[0]=first
list[1]=second
map.key[name]=value
@scope/package=1.2.3

# ── Gradle 9 build, daemon and performance keys ──
org.gradle.java.home=/usr/lib/jvm/temurin-25
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/opt/jdk-21,/opt/jdk-25
org.gradle.workers.max=8
org.gradle.vfs.watch=true
org.gradle.configureondemand=false
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
org.gradle.projectcachedir=.gradle/cache
org.gradle.warning.mode=all
org.gradle.console=rich
org.gradle.logging.level=lifecycle
org.gradle.priority=low
org.gradle.daemon.idletimeout=10800000
org.gradle.welcome=never
org.gradle.dependency.verification=strict
org.gradle.problems.report=true
org.gradle.isolated-projects=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
kotlin.daemon.jvmargs=-Xmx2g
kotlin.incremental=true
android.nonTransitiveRClass=true
android.enableJetifier=false
ORG_GRADLE_PROJECT_signingKey=example-not-a-real-key
systemProp.javax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.user.country=US

# ── Java Properties format rules ──
# whitespace-only separator, and a value that starts after any amount of whitespace
whitespace.separator          value after many spaces
	tab.separator	value after tabs
# separator characters in a value are literal once the first one is consumed
url.query=a=1&b=2:c
colon.in.value:http://example.com:8080/path
equals.in.value==starts with equals
key.only
key.empty=
key.empty.colon:
# form feed and carriage-return escapes, hex escapes in unicode form
escapes.misc=form\ffeed carriage\rreturn tab\tchar quote\"mark\" apos\'mark\'
escapes.unknown=\q\w\e is just q w e
unicode.upper=\u00E9\u00e9
unicode.surrogate=\uD83D\uDCE6
unicode.raw=café ☃ 📦
# trailing backslash pairs: even count ends the line, odd count continues it
ends.with.backslash=C:\\temp\\
continues=first \
          second \
          third
continuation.keeps.leading.space.stripped=a\
   b
empty.continuation=\

# key with every escaped separator character
key\ with\ space=1
key\=with\=equals=2
key\:with\:colon=3
key\#not\!comment=4
\#escaped.hash.start=5
\!escaped.bang.start=6
# keys and values containing placeholders understood by Gradle and Spring
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
placeholder.nested=${a.${b}}
placeholder.default=${missing:-fallback}
percent.literal=100%
dollar.literal=$$5
