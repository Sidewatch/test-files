; Application settings (INI). Sections group related keys.
[general]
name = Inventory API
version = 1.4.0
debug = false

[database]
host = db.internal
port = 5432
user = inventory
; the password lives in the environment, not here
timeout_seconds = 30

[features]
search = on
export = off
max_upload_mb = 25

[paths]
data = /var/lib/inventory
logs = ${data}/logs
