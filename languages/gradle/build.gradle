// ── Groovy 4 language: records, sealed types, switch expressions, var, new operators ──
record Point(int x, int y) {
    Point { if (x < 0) throw new IllegalArgumentException('negative') }
    double distance() { Math.sqrt(x * x + y * y) }
}

sealed interface Shape permits Circle, Square {}
final class Circle implements Shape { double radius }
final class Square implements Shape { double side }

@groovy.transform.CompileStatic
class Typed {
    var inferred = 'var keyword'
    final var constant = 1
    static String describe(Object o) {
        switch (o) {
            case Integer -> 'int'
            case String -> 'string'
            default -> 'other'
        }
    }
    def pick(int n) {
        def label = switch (n) { case 1 -> 'one'; case 2, 3 -> 'few'; default -> { yield 'many' } }
        label
    }
}

