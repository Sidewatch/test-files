interface Describable {
    String describe()
    default String shout() { describe().toUpperCase() }
}

trait Loggable {
    String prefix = '[log]'
    void log(String message) { println "${prefix} ${message}" }
    abstract String name()
}

enum Environment {
    DEV('dev', 1), STAGING('staging', 2), PROD('prod', 3)
    final String label
    final int order
    Environment(String label, int order) { this.label = label; this.order = order }
    boolean isProd() { this == PROD }
}

@interface Marker {
    String value() default 'x'
    int level() default 1
}

@Marker(value = 'inventory', level = 2)
class Release implements Describable, Loggable {
    static final String DEFAULT_NAME = 'release'
    private final List<String> notes = []
    protected int counter
    public String name
    transient String cache
    volatile boolean ready
    static int instances = 0
    @Lazy String lazyValue = expensive()

    Release(String name = DEFAULT_NAME) { this.name = name; instances++ }

    String describe() { "Release ${name}" }
    String name() { name }

    @Override
    String toString() { describe() }

    synchronized void add(String note) throws IllegalStateException {
        if (note == null) throw new IllegalStateException('null note')
        notes << note
    }

    static String expensive() { 'computed' }

    def propertyMissing(String property) { "missing:${property}" }
    def methodMissing(String method, args) { "no:${method}" }
}

