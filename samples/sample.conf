# sample.conf — exercises the Config highlighter (INI + Apache + nginx dialects)

[database]
host = localhost          ; inline INI comment
port = 5432
ssl  = on
password = "s3cr3t"
tags = 'primary'

# --- Apache / .htaccess style ---
<VirtualHost *:80>
    ServerName example.com
    RewriteEngine On
    RewriteRule ^index\.html$ - [L]
    Header set X-Host %{HTTP_HOST}
</VirtualHost>

# --- nginx style ---
server {
    listen 80;
    root ${WEB_ROOT};
    autoindex off;
    location /api {
        proxy_pass http://backend;
    }
}
