; php.ini — the PHP runtime's settings
[PHP]
engine = On
short_open_tag = Off
memory_limit = 256M
max_execution_time = 30
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
log_errors = On
upload_max_filesize = 32M
date.timezone = "Europe/London"

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
