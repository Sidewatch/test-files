[metadata]
name = inventory
version = 1.4.0
description = Inventory API
long_description = file: README.md
license = MIT

[options]
packages = find:
python_requires = >=3.11
install_requires =
    fastapi>=0.110
    sqlalchemy>=2

[options.extras_require]
dev =
    pytest
    ruff

[tool:pytest]
testpaths = tests
